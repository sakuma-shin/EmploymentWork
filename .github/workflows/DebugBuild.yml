name: DebugBuild

on:
  push:
    branches:
      - master

env:
 #リポジトリのルートディレクトリを基点としたそりゅーしょんふぁいるのぱす
 SOLUTION_FILE_PATH: "C:/Projects/Employment work/KamataEngine/DirectXGame/DirectXGame.sln"
 #VisualStudioの構成(Debug/Release)
 CONFIGURATION: Debug

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/Checkout@v4

      -name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64

    -name: build
    run: |
      msbuild ${{env.SOLUTION_FILE_PATH}} /p:Platform=x64,Configuration=${{env.CONFIGURATION}}